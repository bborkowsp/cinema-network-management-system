<div class="container">
  <div class="content">
    <div class="image">
      <img alt="movie poster" class="movie-poster"
           src="{{POSTERS_SERVER_DIRECTORY_URL}}{{ movie.poster }}"/>
    </div>
    <div class="right-column">
      <h1>{{ movie.title }}</h1>
      <div class="description">
        <p>{{ movie.description }}</p>
      </div>
      <div class="details">
        <p>Director: {{ movie.duration }}</p>
      </div>
    </div>
  </div>
</div>
