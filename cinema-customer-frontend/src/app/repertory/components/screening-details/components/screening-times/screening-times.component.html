<div class="background">
  <div class="container">
    <div *ngFor="let cinema of getCinemas()">
      <div class="screening-container">
        <h2>{{ cinema }}</h2>
        <div *ngFor="let variant of getMovieVariants(screeningTimes[cinema])">
          <h3>
            <strong>{{ getEnumValueByKey(variant.projectionTechnology) }}</strong> |
            <strong>{{ variant.language }}</strong>
          </h3>
          <div class="screening-hours-container">
            <div *ngFor="let screening of getScreeningsByVariant(screeningTimes[cinema], variant)">
              <button (click)="handleBuyTicket(screening)" color="accent" mat-flat-button>
                {{ screening.startTime | date:'HH:mm' }}
              </button>
            </div>
          </div>
        </div>
      </div>
      <mat-divider></mat-divider>
    </div>
  </div>
</div>
