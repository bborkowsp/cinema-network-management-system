<div class="group">
  <div class="group__left-column">
    <div class="screen-and-seats">
      <div class="image-container">
        <div class="text-over-img">SCREEN</div>
        <img alt="Screen" class="screen-svg" height="70" src="assets/screen.svg" width="200"/>
      </div>
      <div *ngFor="let rows of data.screeningRoom.seats; let rowIndex = index" class="seat-row">
        <!-- Row number -->
        <div class="row-number">{{ rowIndex + 1 }}</div>

        <!-- Seats -->
        <div *ngFor="let seat of rows" class="seat">
          <ng-container *ngIf="seat.seatZone !== 'CORRIDOR'; else corridorSpace">
            <button (click)="selectSeat(seat)"
                    [disabled]="seat.seatStatus === 'UNAVAILABLE' || seat.seatStatus === 'RESERVED'"
                    [matTooltip]="seat.seatZone === 'STANDARD' ? '27,90 ZŁ' :
           seat.seatZone === 'VIP' ? '35,90 ZŁ' :
           seat.seatZone === 'PROMO' ? '19,90 ZŁ' :
           seat.seatZone === 'WHEELCHAIR' ? '19,90 ZŁ' : ''"
                    [ngClass]="{
      'btn': true,
      'selected-standard': seat.seatZone === 'STANDARD' && seat.seatStatus !== 'RESERVED',
      'selected-vip': seat.seatZone === 'VIP' && seat.seatStatus !== 'RESERVED',
      'selected-promo': seat.seatZone === 'PROMO' && seat.seatStatus !== 'RESERVED',
      'selected-wheelchair': seat.seatZone === 'WHEELCHAIR' && seat.seatStatus !== 'RESERVED',
      'reserved': seat.seatStatus === 'RESERVED'
    }"
                    [ngStyle]="{
      'background-color': getSeatBackgroundColor(seat),
      'border-color': seat.seatStatus === 'RESERVED' ? 'rgba(0, 0, 0, 0.4)' : ''
    }"
                    mat-mini-fab>
              <mat-icon>
                {{
                  seat.seatStatus === 'UNAVAILABLE' ? 'block' : ''
                }}
              </mat-icon>
            </button>
          </ng-container>

          <!-- Placeholder for CORRIDOR to maintain spacing -->
          <ng-template #corridorSpace>
            <div class="corridor-space"></div>
          </ng-template>
        </div>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item">
        <button class=" size reserved selected-legen" mat-mini-fab>
          <mat-icon class=""></mat-icon>
        </button>
        <span class="legend-text">Reserved</span>
      </div>
      <div class="legend-item">
        <mat-icon class="legend-icon">block</mat-icon>
        <span class="legend-text">Unavailable</span>
      </div>
    </div>
  </div>

  <div class="group__right-column">
    <h2>Summary</h2>
    <hr>
    <div class="selected-seats">
      <div *ngFor="let seat of selectedSeats" class="selected-seat">
        <button [ngStyle]="{ 'background-color': getSeatBackgroundColor(seat) }" class="selected-seat"
                mat-mini-fab>
          R:{{ seat.seatRow + 1 }} C:{{ seat.seatColumn }}
        </button>
      </div>
    </div>

    <div class="total">
      <H4>Total cost: <strong>{{ totalCost }} ZŁ</strong></H4>
      <span></span>
    </div>
  </div>
</div>
