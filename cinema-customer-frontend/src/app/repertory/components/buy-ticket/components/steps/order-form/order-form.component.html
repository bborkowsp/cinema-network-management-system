<span></span>
<form class="form">
  <mat-form-field class="custom-form-field">
    <mat-label>First name</mat-label>
    <input [formControl]="firstNameControl" matInput required>
  </mat-form-field>
  <mat-form-field class="custom-form-field">
    <mat-label>Last name</mat-label>
    <input [formControl]="lastNameControl" matInput required>
  </mat-form-field>
  <mat-form-field class="custom-form-field">
    <mat-label>E-Mail</mat-label>
    <input [formControl]="emailControl" matInput required>
  </mat-form-field>
  <mat-form-field class="custom-form-field">
    <mat-label>Confirm E-Mail</mat-label>
    <input [formControl]="lastNameControl" matInput required>
  </mat-form-field>

  <mat-selection-list [multiple]="false">
    <mat-list-option *ngFor="let payment of paymentMethods" class="mat-primary">
      <div class="custom-form-field">
        <img [src]="getPaymentIcon(payment)" alt="{{ payment }}-icon" class="option-icon">
        {{ payment }}
      </div>
    </mat-list-option>
  </mat-selection-list>
</form>
