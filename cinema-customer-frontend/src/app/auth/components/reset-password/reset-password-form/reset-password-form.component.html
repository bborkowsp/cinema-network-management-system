<div class="container">
  <div class="header">
    <h1 class="title">Reset password</h1>
  </div>
  <form (ngSubmit)="resetPassword()" [formGroup]="resetPasswordForm" class="form">
    <mat-form-field class="input">
      <mat-label>New password</mat-label>
      <input [formControl]="newPasswordControl" [type]="hideNewPassword() ? 'password' : 'text'" matInput required
      >
      <button
        (click)="hidePassword($event, PasswordType.NEW)"
        [attr.aria-label]="'Hide new password'"
        [attr.aria-pressed]="hideNewPassword()"
        mat-icon-button
        matSuffix
        type="button"
      >
        <mat-icon>{{ hideNewPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    <mat-form-field class="input">
      <mat-label>Confirm new password</mat-label>
      <input [formControl]="newPasswordConfirmationControl" [type]="hideNewPasswordConfirmation() ? 'password' : 'text'"
             matInput required>
      <button
        (click)="hidePassword($event, PasswordType.CONFIRMATION)"
        [attr.aria-label]="'Hide password confirmation'"
        [attr.aria-pressed]="hideNewPasswordConfirmation()"
        mat-icon-button
        matSuffix
        type="button"
      >
        <mat-icon>{{ hideNewPasswordConfirmation() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    <mat-error *ngIf="resetPasswordForm.hasError('mismatch') && newPasswordConfirmationControl.dirty"
               class="error-message">
      Passwords do not match
    </mat-error>

    <button [disabled]="resetPasswordForm.invalid" color="primary" mat-raised-button type="submit">
      Change password
    </button>
  </form>
</div>
<app-page-bottom-section></app-page-bottom-section>
