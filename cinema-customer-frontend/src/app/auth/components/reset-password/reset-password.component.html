<div class="container">
  <div class="header">
    <h1 class="title">Reset password</h1>
    <p class="subtitle">Enter your email address and we'll send you a link to reset your password.</p>
  </div>
  <form (ngSubmit)="submit()" [formGroup]="form" class="form">
    <mat-form-field class="input">
      <mat-label>Email</mat-label>
      <input [formControl]="emailControl" matInput>
    </mat-form-field>
    <button [disabled]="form.invalid" color="primary" mat-raised-button type="submit">
      Login
    </button>
  </form>
</div>
<app-page-bottom-section></app-page-bottom-section>
