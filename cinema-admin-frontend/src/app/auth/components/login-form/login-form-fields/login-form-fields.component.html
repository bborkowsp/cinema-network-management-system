<div class="inputs-form-container">
  <mat-form-field class="input-form-field">
    <mat-label>Email</mat-label>
    <input [formControl]="emailControl" matInput maxlength="255" required>
  </mat-form-field>

  <mat-form-field class="input-form-field">
    <mat-label>Password</mat-label>
    <input
      [formControl]="passwordControl" [type]="hidePassword() ? 'password' : 'text'"
      matInput maxlength="255" required
    >
    <button
      (click)="hidePasswordEvent($event)"
      [attr.aria-label]="'Hide password'"
      [attr.aria-pressed]="hidePassword()"
      mat-icon-button
      matSuffix
      type="button"
    >
      <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
  </mat-form-field>
</div>
