<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AccountVerificationTemplate</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
        }

        .email-container {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
            min-height: 100vh;
        }

        .email-container h1 {
            color: #ffffff;
        }

        .email-content {
            background-color: #f8cc3c;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px 0px #aaaaaa;
            display: inline-block;
            max-width: 600px;
            margin: auto;
        }

        .email-content h1 {
            color: #333333;
        }

        .email-content p {
            color: #555555;
            font-size: 16px;
            line-height: 1.6;
        }

        .email-content a {
            background-color: #683cb4;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 20px;
        }

        .email-footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888888;
        }
    </style>
</head>
<body>
<div class="email-container">
    <h1>Welcome to our cinema family!</h1>
    <div class="email-content">
        <h1>Confirm Your Account</h1>
        <p>Thank you for registering. Please click the button below to confirm your account:</p>
        <a href="{{link}}">Confirm Account</a>
    </div>
    <div class="email-footer">
        <p>If you did not create an account, please ignore this email.</p>
    </div>
</div>
</body>
</html>
