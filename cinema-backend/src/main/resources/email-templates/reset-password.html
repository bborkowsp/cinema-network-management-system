<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ResetPasswordTemplate</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
        }

        .container {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
            min-height: 100vh;
        }

        .container h1 {
            color: #ffffff;
        }

        .content {
            background-color: #f8cc3c;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px 0px #aaaaaa;
            display: inline-block;
            max-width: 600px;
            margin: auto;
        }

        .content h1 {
            color: #333333;
        }

        .content p {
            color: #555555;
            font-size: 16px;
            line-height: 1.6;
        }

        .content a {
            background-color: #683cb4;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 20px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888888;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Reset your password!</h1>
    <div class="content">
        <p>Click the button below, to reset your password!</p>
        <a href="{{link}}">Reset Password</a>
    </div>
    <div class="footer">
        <p>If you did not create an account, please ignore this email.</p>
    </div>
</div>
</body>
</html>
